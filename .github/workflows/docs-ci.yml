name: Docs CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run link-checker regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check internal Markdown links
        run: python -m scripts.check_links

      - name: Build documentation site (strict)
        run: mkdocs build --strict

      - name: Compile Python scripts, examples, and tests
        run: python -m compileall -q scripts examples tests
